name: Site checks

on:
  workflow_dispatch:
  push:
    branches: [hd-assets]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd-assets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic site upgrade
        run: python scripts/upgrade-site.py
      - name: Run site tests
        run: npm test
      - name: Commit verified site upgrade
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No index.html changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: publish HD visuals and locale-aware bilingual hierarchy'
          git pull --rebase origin hd-assets
          git push origin HEAD:hd-assets

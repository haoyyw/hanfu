name: Site checks

on:
  workflow_dispatch:
  push:
    branches: [hd-assets]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

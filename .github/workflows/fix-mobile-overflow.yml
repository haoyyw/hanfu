name: Fix mobile root overflow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'Add iOS mobile overflow fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile viewport constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "@media(max-width:900px){:root{--shell:min(100% - 28px,1220px)}body{overflow-x:hidden}.section{padding:76px 0}"
          new = "@media(max-width:900px){/* mobile-root-overflow-fix */:root{--shell:calc(100% - 28px)}html,body{width:100%;max-width:100%;overflow-x:hidden}body{position:relative}.shell{width:calc(100% - 28px);max-width:1220px}main,header,.section,.hero,.footer{width:100%;max-width:100%}.intro-grid>*,.heading>*,.editorial>*,.ceremonial-grid>*,.tea-grid>*,.dessert-grid>*,.coming-grid>*,.booking-grid>*,.complete>*,.stage>*,#dynasties .dynasty-stage>*,#dynasties .look-grid>*{min-width:0;max-width:100%}img,figure{max-width:100%}.section{padding:76px 0}"
          if old not in s:
              raise SystemExit('Expected mobile media prefix not found; refusing broad edit')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify static regression and JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          assert '--shell:min(100% - 28px,1220px)' not in s
          assert '/* mobile-root-overflow-fix */' in s
          assert 'html,body{width:100%;max-width:100%;overflow-x:hidden}' in s
          assert '.shell{width:calc(100% - 28px);max-width:1220px}' in s
          assert 'min-width:0;max-width:100%' in s
          m = re.search(r'<script>(.*?)</script>', s, re.S)
          assert m
          Path('/tmp/hanfu.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/hanfu.js
      - name: Update index.html via GitHub Contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/contents/index.html'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hanfu-mobile-overflow-fix'
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as r:
              meta = json.load(r)
          payload = json.dumps({
              'message': 'Fix iOS mobile horizontal overflow',
              'content': base64.b64encode(Path('index.html').read_bytes()).decode(),
              'sha': meta['sha'],
              'branch': 'main'
          }).encode()
          req = urllib.request.Request(url, data=payload, headers={**headers, 'Content-Type':'application/json'}, method='PUT')
          with urllib.request.urlopen(req) as r:
              result = json.load(r)
          print(result['commit']['sha'])
          PY

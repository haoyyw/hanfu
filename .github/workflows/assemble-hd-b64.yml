name: Assemble HD b64 assets

on:
  push:
    branches: [hd-assets]
    paths:
      - 'assets/hd-b64/*.txt'
      - '.github/workflows/assemble-hd-b64.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd-assets
          fetch-depth: 0
      - name: Decode staged AVIF assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          built=0
          skipped=0
          for p0 in assets/hd-b64/*.0.txt; do
            [ -e "$p0" ] || continue
            p1="${p0%.0.txt}.1.txt"
            name="$(basename "${p0%.0.txt}")"
            tmp="$(mktemp)"
            if [ -f "$p1" ]; then
              cat "$p0" "$p1" | tr -cd 'A-Za-z0-9+/=' > "$tmp"
            else
              tr -cd 'A-Za-z0-9+/=' < "$p0" > "$tmp"
            fi
            if base64 -d "$tmp" > "assets/images/${name}.avif" 2>/dev/null && test -s "assets/images/${name}.avif"; then
              echo "assembled ${name}.avif"
              built=1
            else
              echo "skipped invalid staged asset: ${name}"
              rm -f "assets/images/${name}.avif"
              skipped=$((skipped+1))
            fi
            rm -f "$tmp"
          done
          echo "assembled_any=$built skipped=$skipped"
          if [ "$built" -eq 0 ]; then
            echo 'No valid staged assets were assembled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/*.avif
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'chore: assemble HD AVIF assets'
          git pull --rebase origin hd-assets
          git push origin HEAD:hd-assets

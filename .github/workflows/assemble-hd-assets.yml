name: Assemble HD assets

on:
  push:
    branches: [hd-assets]
    paths:
      - '.asset-b64/*.part1'
      - '.asset-b64/*.part2'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hd-assets
          fetch-depth: 0
      - name: Rebuild available AVIF assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          changed=0
          for p1 in .asset-b64/*.part1; do
            [ -e "$p1" ] || continue
            base="${p1%.part1}"
            p2="${base}.part2"
            [ -f "$p2" ] || continue
            name="$(basename "$base")"
            cat "$p1" "$p2" | tr -d '\n\r' | base64 -d > "assets/images/${name}.avif"
            test -s "assets/images/${name}.avif"
            changed=1
          done
          if [ "$changed" -eq 0 ]; then
            echo 'No complete asset pairs yet.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/*.avif
          if git diff --cached --quiet; then
            echo 'No binary changes to commit.'
            exit 0
          fi
          git commit -m 'chore: assemble HD AVIF site assets'
          git push origin HEAD:hd-assets

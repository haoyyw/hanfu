name: Apply parallax reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-parallax.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify parallax engine
        run: node --check assets/parallax.js
      - name: Patch index reference
        id: patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="assets/parallax.js" defer></script>'
          if tag not in s:
              if '</head>' not in s:
                  raise SystemExit('Missing </head>')
              s = s.replace('</head>', tag + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          if s.count(tag) != 1:
              raise SystemExit('Parallax script reference must appear exactly once')
          PY
          if git diff --quiet -- index.html; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Update index.html through GitHub Contents API
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/contents/index.html'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'huashang-parallax-workflow'
          }
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as response:
              current = json.load(response)
          content = base64.b64encode(Path('index.html').read_bytes()).decode('ascii')
          payload = json.dumps({
              'message': 'Enable lightweight parallax effects',
              'content': content,
              'sha': current['sha'],
              'branch': 'main'
          }).encode('utf-8')
          req = urllib.request.Request(url, data=payload, method='PUT', headers={**headers, 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY

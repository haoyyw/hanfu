name: Fix dynasty tabs JavaScript

on:
  push:
    paths:
      - '.github/workflows/fix-dynasty-js.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the malformed newline literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          broken = "lines.join('\n')"
          fixed = "lines.join('\\n')"
          n = s.count(broken)
          if n != 1:
              raise SystemExit(f'Expected exactly one malformed join literal; found {n}')
          p.write_text(s.replace(broken, fixed), encoding='utf-8')
          PY
      - name: Verify JavaScript syntax and dynasty wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/hanfu.js').write_text(m.group(1), encoding='utf-8')
          for key in ('han','tang','song','ming'):
              if f'data-dynasty="{key}"' not in s:
                  raise SystemExit(f'Missing tab: {key}')
              if f"{key}-look-1-v7.webp" not in s or f"{key}-look-2-v7.webp" not in s:
                  raise SystemExit(f'Missing look assets in wiring: {key}')
          if "querySelectorAll('[data-dynasty]').forEach" not in s:
              raise SystemExit('Dynasty click binding not found')
          PY
          node --check /tmp/hanfu.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix dynasty tab JavaScript syntax'
          git push
